<!doctype html><meta charset="utf-8"><title>Stageplay dialogue revision review</title><style>body{margin:20px;background:#101827;color:#eef2ff;font:17px system-ui}video{max-width:100%;width:1200px;display:block;image-rendering:pixelated}button{margin:10px 5px;padding:8px}output{display:block;margin:12px}</style><video id="film" src="location-remote.mp4" controls muted preload="auto"></video><div id="shots"></div><output id="state"></output><script>const v=document.querySelector('video');for(const [label,time] of [['Remote',0],['Closer',8],['Act two',14],['Green Hill',21],['Island',29],['Home',39],['Mostly',46]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{v.currentTime=time;v.play()};shots.append(b)}v.ontimeupdate=()=>state.value=`${v.currentTime.toFixed(2)} / ${v.duration.toFixed(2)} seconds · ${v.getVideoPlaybackQuality().droppedVideoFrames} dropped frames`;</script>
