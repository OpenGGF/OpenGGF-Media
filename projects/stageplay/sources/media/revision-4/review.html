<!doctype html><html lang="en"><meta charset="utf-8"><title>Stageplay — Puppet motion review</title>
<style>body{margin:0;background:#101721;color:#f4eedf;font:16px system-ui}main{max-width:1200px;margin:24px auto}h1{font-size:24px;margin:0 0 6px}p{color:#bac6d5}video{display:block;width:100%;background:#060a11}button{background:#243a58;color:#f4eedf;border:1px solid #426990;border-radius:5px;padding:8px;margin:8px 4px 8px 0}output{font:14px monospace;display:block;padding:8px 0}</style>
<main><h1>Location, Location, Location</h1><p>Revision 4 · native Puppet movement against detached ROM terrain · 51 seconds</p>
<video controls playsinline preload="metadata" src="stageplay-promo.mp4"></video>
<button data-src="stageplay-promo.mp4">Promo</button><button data-src="location-remote.mp4">Full short</button><button id="restart">Review from start</button>
<output id="state"></output><p>Named dialogue, fixed zoom, native jump holds and terrain support. World objects and zone events are not simulated. Video review does not establish physical audio listening.</p></main>
<script>const video=document.querySelector('video');document.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{video.src=b.dataset.src;video.load()});document.querySelector('#restart').onclick=()=>{video.currentTime=0;video.playbackRate=1;video.play()};function report(){const q=video.getVideoPlaybackQuality();document.querySelector('#state').textContent=JSON.stringify({seconds:video.currentTime,rate:video.playbackRate,ended:video.ended,presented:q.totalVideoFrames,dropped:q.droppedVideoFrames})}video.addEventListener('timeupdate',report);video.addEventListener('ended',report);</script></html>
